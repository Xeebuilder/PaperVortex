<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Vortex Studios | Apple Style Kinetic Ad</title>
  <link rel="icon" type="image/png" href="logo-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      perspective: 1200px;
    }

    /* Ambient Stage */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
      background: radial-gradient(circle at center, #0f0f15 0%, #000000 80%);
      overflow: hidden;
      transition: background 0.2s ease;
    }

    /* Flash Transition Overlay */
    .flash-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.08s ease-out;
    }

    .flash-overlay.active {
      opacity: 0.95;
      transition: none;
    }

    /* Screen Shake */
    .shake {
      animation: screenShake 0.35s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes screenShake {
      10%, 90% { transform: translate3d(-3px, 1px, 0) rotate(-0.5deg); }
      20%, 80% { transform: translate3d(5px, -2px, 0) rotate(1deg); }
      30%, 50%, 70% { transform: translate3d(-6px, 3px, 0) rotate(-1deg); }
      40%, 60% { transform: translate3d(6px, -3px, 0) rotate(1deg); }
    }

    /* Kinetic Text Box */
    .text-box {
      font-size: clamp(38px, 6.8vw, 92px);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.05;
      text-transform: uppercase;
      opacity: 0;
      transform: scale(0.85) translateZ(-50px);
      transition: opacity 0.1s cubic-bezier(0.16, 1, 0.3, 1), transform 0.12s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 1100px;
      z-index: 10;
      will-change: transform, opacity;
    }

    .text-box.active {
      opacity: 1;
      transform: scale(1) translateZ(0);
    }

    /* Mega Expand Effect for "CAMBIA ESO" */
    .text-box.mega-expand {
      animation: violentZoom 0.9s cubic-bezier(0.8, 0, 0.2, 1) forwards;
    }

    @keyframes violentZoom {
      0% {
        opacity: 1;
        transform: scale(1) translateZ(0);
        filter: blur(0px);
      }
      40% {
        opacity: 1;
        transform: scale(2.8) translateZ(100px);
        filter: blur(2px);
        color: #ff3b30;
      }
      100% {
        opacity: 0;
        transform: scale(22) translateZ(500px);
        filter: blur(20px);
        color: #fff;
      }
    }

    /* WhatsApp Buyer Bubble Mockup */
    .wa-bubble-wrap {
      display: none;
      margin-top: 25px;
      background: #005c4b;
      color: #e9edef;
      padding: 18px 28px;
      border-radius: 20px;
      border-bottom-left-radius: 4px;
      font-size: clamp(20px, 3vw, 36px);
      font-weight: 600;
      max-width: 780px;
      box-shadow: 0 20px 50px rgba(0, 92, 75, 0.4);
      animation: popBubble 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    @keyframes popBubble {
      0% { transform: scale(0.6) translateY(30px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Highlights & Color Gradients */
    .highlight-red { color: #ff3b30; text-shadow: 0 0 45px rgba(255, 59, 48, 0.5); }
    .highlight-gold { color: #f5a623; text-shadow: 0 0 45px rgba(245, 166, 35, 0.5); }
    .highlight-blue { color: #2997ff; text-shadow: 0 0 45px rgba(41, 151, 255, 0.5); }
    .highlight-green { color: #30d158; text-shadow: 0 0 45px rgba(48, 209, 88, 0.5); }
    .highlight-comedy {
      color: #ffd60a;
      font-style: italic;
      font-size: 0.85em;
      text-transform: none;
      letter-spacing: -0.02em;
    }

    /* Logo Outro */
    .logo-outro {
      display: none;
      margin-bottom: 25px;
      animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.7) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .logo-img {
      height: clamp(90px, 16vw, 170px);
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.45));
    }

    /* Top Progress Bar */
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #2997ff, #30d158);
      width: 0%;
      transition: width 0.1s linear;
      z-index: 100;
      box-shadow: 0 0 15px #2997ff;
    }

    /* Floating Apple Controls */
    .controls {
      position: absolute;
      bottom: 30px;
      display: flex;
      gap: 12px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      padding: 10px 20px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .btn {
      background: #fff;
      color: #000;
      border: none;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 22px;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .btn:hover { transform: scale(1.05); background: #f0f0f0; }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.25); }

    .brand-tag {
      position: absolute;
      top: 30px;
      left: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .brand-tag img {
      height: 24px;
      width: auto;
    }
  </style>
</head>
<body>

  <div class="progress-bar" id="progressBar"></div>
  <div class="flash-overlay" id="flashOverlay"></div>

  <div class="brand-tag">
    <img src="logo-icon.png" alt="Paper Vortex">
    <span>Paper Vortex Studios</span>
  </div>

  <div class="stage" id="stage">
    <div class="logo-outro" id="logoOutro">
      <img src="logo.png" alt="Paper Vortex Studios" class="logo-img">
    </div>

    <div class="text-box" id="textBox">TOCA INICIAR PARA VER EL ANUNCIO</div>

    <div class="wa-bubble-wrap" id="waBubble">
      "Hola, ¿cuánto pide de renta y cuántos cuartos tiene?"
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn" id="playBtn" onclick="togglePlay()">▶ Iniciar Anuncio</button>
      <button class="btn btn-ghost" id="audioBtn" onclick="toggleAudio()">🔊 Audio: ON</button>
      <button class="btn btn-ghost" id="langBtn" onclick="toggleLang()">🌐 ES / EN</button>
      <button class="btn btn-ghost" onclick="restart()">↺ Reiniciar</button>
    </div>
  </div>

  <script>
    // ==========================================
    // CINEMATIC STORYBOARD & TIMING
    // ==========================================
    const storyES = [
      // Act 1: The Late Night Scenario (Clock ticking / low tension)
      { text: "11:42 PM.", dur: 900, type: "intro" },
      { text: "UN COMPRADOR CALIFICADO...", dur: 1000, type: "beat" },
      { text: "VE TU PROPIEDAD EN BRICKELL.", dur: 1100, type: "beat" },
      { text: "TE ESCRIBE POR WHATSAPP:", dur: 950, type: "bubble", bubbleText: "«¿Cuánto pide de renta? ¿Cuántos cuartos?»" },
      { text: "Y TÚ...", dur: 900, type: "beat" },
      { text: "ESTÁS <span class='highlight-blue'>DURMIENDO.</span>", dur: 1100, type: "beat" },
      { text: "O EN UNA CITA.", dur: 950, type: "comedic_prep" },

      // Act 2: COMIC RELIEF & RECORD SCRATCH (Beat stops dead!)
      { text: "<span class='highlight-comedy'>👀 (Bueno... esperemos que sea buena cita 🥂)</span>", dur: 1800, type: "comedy_pause" },
      { text: "PERO EL COMPRADOR...", dur: 950, type: "tension_slow" },
      { text: "<span class='highlight-red'>NO ESPERA.</span>", dur: 950, type: "tension_slow" },
      { text: "LE ESCRIBIÓ AL OTRO REALTOR.", dur: 1050, type: "tension_slow" },
      { text: "Y PERDISTE <span class='highlight-red'>$15,000</span> EN COMISIÓN.", dur: 1200, type: "shake" },

      // Act 3: VIOLENT MEGA EXPAND ("CAMBIA ESO" takes over screen)
      { text: "<span class='highlight-red'>CAMBIA ESO.</span>", dur: 1150, type: "mega_expand" },

      // Act 4: Explosive 808 & Chords Drop - The Solution
      { text: "ASISTENTE DE IA EN WHATSAPP.", dur: 1100, type: "drop_beat" },
      { text: "CONECTADO A TU WEB <span class='highlight-gold'>EN 24 HORAS</span>.", dur: 1150, type: "beat_high" },
      { text: "SABE SI ES <span class='highlight-gold'>VENTA O ALQUILER</span>.", dur: 1100, type: "beat_high" },
      { text: "CUARTOS. METRAJE. PRECIOS. HOA.", dur: 1150, type: "beat_high" },
      { text: "FILTRA EL PRESUPUESTO REAL.", dur: 1050, type: "beat_high" },
      { text: "TE ENTREGA LA CITA <span class='highlight-green'>AGENDADA</span>.", dur: 1200, type: "beat_high" },
      { text: "MIENTRAS DUERMES...", dur: 950, type: "beat" },
      { text: "<span class='highlight-comedy'>😉 (O sigues en tu cita)</span>", dur: 1100, type: "comedy_wink" },

      // Act 5: Irresistible Offer & Outro
      { text: "PRUÉBALO <span class='highlight-green'>1 SEMANA 100% GRATIS.</span>", dur: 1400, type: "beat_final" },
      { text: "PAPER VORTEX STUDIOS.", dur: 2200, type: "outro_logo" }
    ];

    const storyEN = [
      { text: "11:42 PM.", dur: 900, type: "intro" },
      { text: "A QUALIFIED LUXURY BUYER...", dur: 1000, type: "beat" },
      { text: "SEES YOUR BRICKELL LISTING.", dur: 1100, type: "beat" },
      { text: "MESSAGES YOUR WHATSAPP:", dur: 950, type: "bubble", bubbleText: "“How much is rent? How many bedrooms?”" },
      { text: "AND YOU...", dur: 900, type: "beat" },
      { text: "ARE SOUND <span class='highlight-blue'>ASLEEP.</span>", dur: 1100, type: "beat" },
      { text: "OR ON A DATE.", dur: 950, type: "comedic_prep" },

      // Act 2: COMIC RELIEF
      { text: "<span class='highlight-comedy'>👀 (Hey... hope it's a good date 🥂)</span>", dur: 1800, type: "comedy_pause" },
      { text: "BUT THE BUYER...", dur: 950, type: "tension_slow" },
      { text: "<span class='highlight-red'>DOESN'T WAIT.</span>", dur: 950, type: "tension_slow" },
      { text: "THEY MESSAGED ANOTHER AGENT.", dur: 1050, type: "tension_slow" },
      { text: "AND YOU LOST A <span class='highlight-red'>$15,000</span> COMMISSION.", dur: 1200, type: "shake" },

      // Act 3: VIOLENT MEGA EXPAND
      { text: "<span class='highlight-red'>CHANGE THAT.</span>", dur: 1150, type: "mega_expand" },

      // Act 4: Explosive Drop
      { text: "24/7 AI AGENT ON WHATSAPP.", dur: 1100, type: "drop_beat" },
      { text: "CONNECTED TO YOUR WEBSITE <span class='highlight-gold'>IN 24H</span>.", dur: 1150, type: "beat_high" },
      { text: "KNOWS <span class='highlight-gold'>SALE OR RENT</span>.", dur: 1100, type: "beat_high" },
      { text: "BEDROOMS. SQUARE FOOTAGE. HOA.", dur: 1150, type: "beat_high" },
      { text: "QUALIFIES REAL BUYER FUNDS.", dur: 1050, type: "beat_high" },
      { text: "HANDS YOU THE <span class='highlight-green'>BOOKED TOUR</span>.", dur: 1200, type: "beat_high" },
      { text: "WHILE YOU SLEEP...", dur: 950, type: "beat" },
      { text: "<span class='highlight-comedy'>😉 (Or stay on your date)</span>", dur: 1100, type: "comedy_wink" },

      // Act 5: Outro
      { text: "TEST IT <span class='highlight-green'>1 WEEK 100% FREE.</span>", dur: 1400, type: "beat_final" },
      { text: "PAPER VORTEX STUDIOS.", dur: 2200, type: "outro_logo" }
    ];

    let currentStory = storyES;
    let step = 0;
    let isPlaying = false;
    let audioEnabled = true;
    let timer = null;
    let audioCtx = null;
    let masterGain = null;
    let noiseBuffer = null;

    // ==========================================
    // AUDIO ENGINE: 808, SYNTH, PIANO & FX
    // ==========================================
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Master Limiter / Compressor
        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.setValueAtTime(-14, audioCtx.currentTime);
        comp.knee.setValueAtTime(20, audioCtx.currentTime);
        comp.ratio.setValueAtTime(10, audioCtx.currentTime);
        comp.attack.setValueAtTime(0.002, audioCtx.currentTime);
        comp.release.setValueAtTime(0.2, audioCtx.currentTime);

        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.75, audioCtx.currentTime);

        masterGain.connect(comp);
        comp.connect(audioCtx.destination);

        // Noise buffer
        const len = audioCtx.sampleRate * 1;
        noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Heavy 808 Sub Kick
    function play808(intensity = 1.0) {
      if (!audioEnabled || !audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, t);
      osc.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      osc.frequency.exponentialRampToValueAtTime(32, t + 0.45);

      gain.gain.setValueAtTime(0.9 * intensity, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.48);

      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.5);
    }

    // Crisp Tech Clap/Snare
    function playClap() {
      if (!audioEnabled || !audioCtx || !noiseBuffer) return;
      const t = audioCtx.currentTime;
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1600, t);
      filter.Q.setValueAtTime(2, t);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      noise.start(t);
      noise.stop(t + 0.19);
    }

    // Modern Synth / Electric Piano Chords
    function playSynthChord(chordFreqs, duration = 0.6) {
      if (!audioEnabled || !audioCtx) return;
      const t = audioCtx.currentTime;
      chordFreqs.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, t);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1800, t);
        filter.frequency.exponentialRampToValueAtTime(350, t + duration);
        filter.Q.setValueAtTime(3, t);

        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);

        osc.start(t);
        osc.stop(t + duration + 0.05);
      });
    }

    // Record Scratch / Sudden Brake (Comedy release)
    function playRecordScratch() {
      if (!audioEnabled || !audioCtx || !noiseBuffer) return;
      const t = audioCtx.currentTime;

      // Scratch noise
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(3200, t);
      filter.frequency.exponentialRampToValueAtTime(200, t + 0.28);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.6, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      noise.start(t);
      noise.stop(t + 0.31);

      // Pitch wobble
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(500, t);
      osc.frequency.exponentialRampToValueAtTime(60, t + 0.28);
      oscGain.gain.setValueAtTime(0.4, t);
      oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.29);
      osc.connect(oscGain);
      oscGain.connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.3);
    }

    // Comedic Elevator / Comedy Bell Chime (Ding!)
    function playComedyChime() {
      if (!audioEnabled || !audioCtx) return;
      const t = audioCtx.currentTime;
      const notes = [1046.5, 1318.5, 1567.98]; // C6, E6, G6
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t + idx * 0.08);

        gain.gain.setValueAtTime(0.28, t + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.08 + 0.65);

        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(t + idx * 0.08);
        osc.stop(t + idx * 0.08 + 0.7);
      });
    }

    // Massive Explosion Boom for "CAMBIA ESO"
    function playMegaImpact() {
      if (!audioEnabled || !audioCtx || !noiseBuffer) return;
      const t = audioCtx.currentTime;

      // Heavy 808 Sub Drop
      play808(1.5);

      // White noise explosion burst
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(8000, t);
      filter.frequency.exponentialRampToValueAtTime(150, t + 0.7);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.7, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      noise.start(t);
      noise.stop(t + 0.85);
    }

    // Grand Finale Cinema Chords
    function playOutroPad() {
      if (!audioEnabled || !audioCtx) return;
      // Lush F minor 9th (F3, Ab3, C4, Eb4, G4)
      playSynthChord([174.61, 207.65, 261.63, 311.13, 392.0], 1.8);
    }

    // ==========================================
    // FRAME ORCHESTRATION & ANIMATIONS
    // ==========================================
    const chordFm = [174.61, 207.65, 261.63]; // F minor
    const chordDb = [138.59, 174.61, 207.65]; // Db Major
    const chordBbm = [116.54, 138.59, 174.61]; // Bb minor
    const chordC = [130.81, 164.81, 196.00];   // C dominant

    function nextFrame() {
      if (step >= currentStory.length) {
        step = 0;
      }

      const frame = currentStory[step];
      const stage = document.getElementById('stage');
      const textBox = document.getElementById('textBox');
      const waBubble = document.getElementById('waBubble');
      const logoOutro = document.getElementById('logoOutro');
      const flashOverlay = document.getElementById('flashOverlay');
      const progressBar = document.getElementById('progressBar');

      // Reset states
      textBox.classList.remove('active', 'mega-expand');
      stage.classList.remove('shake');
      waBubble.style.display = 'none';
      logoOutro.style.display = 'none';

      setTimeout(() => {
        textBox.innerHTML = frame.text;
        textBox.classList.add('active');

        // Progress bar
        const pct = ((step + 1) / currentStory.length) * 100;
        progressBar.style.width = pct + '%';

        // TYPE-SPECIFIC ACTIONS & SOUNDS
        switch (frame.type) {
          case 'intro':
            playSynthChord(chordFm, 0.8);
            break;

          case 'beat':
            play808(0.9);
            playSynthChord(chordFm, 0.4);
            break;

          case 'bubble':
            play808(0.8);
            waBubble.innerText = frame.bubbleText;
            waBubble.style.display = 'inline-block';
            break;

          case 'comedic_prep':
            playSynthChord(chordDb, 0.5);
            break;

          case 'comedy_pause':
            // RECORD SCRATCH + COMIC CHIME + BEAT CUTS OFF!
            playRecordScratch();
            setTimeout(playComedyChime, 240);
            break;

          case 'tension_slow':
            // Low tense notes, no drums
            playSynthChord(chordBbm, 0.7);
            break;

          case 'shake':
            stage.classList.add('shake');
            play808(1.2);
            playClap();
            break;

          case 'mega_expand':
            // VIOLENT SCREEN EXPANSION & EXPLOSION!
            textBox.classList.add('mega-expand');
            flashOverlay.classList.add('active');
            stage.classList.add('shake');
            playMegaImpact();
            setTimeout(() => {
              flashOverlay.classList.remove('active');
            }, 80);
            break;

          case 'drop_beat':
            play808(1.4);
            playClap();
            playSynthChord(chordFm, 0.9);
            break;

          case 'beat_high':
            play808(1.1);
            playClap();
            playSynthChord(step % 2 === 0 ? chordDb : chordBbm, 0.5);
            break;

          case 'comedy_wink':
            playComedyChime();
            break;

          case 'beat_final':
            play808(1.3);
            playClap();
            playSynthChord(chordDb, 1.0);
            break;

          case 'outro_logo':
            logoOutro.style.display = 'block';
            textBox.style.fontSize = 'clamp(24px, 4.5vw, 52px)';
            play808(1.2);
            playOutroPad();
            break;
        }

        step++;
        if (isPlaying) {
          timer = setTimeout(nextFrame, frame.dur);
        }
      }, 60);
    }

    function togglePlay() {
      initAudio();
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');

      if (isPlaying) {
        btn.innerText = "⏸ Pausar";
        nextFrame();
      } else {
        btn.innerText = "▶ Reanudar";
        clearTimeout(timer);
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audioBtn').innerText = audioEnabled ? "🔊 Audio: ON" : "🔇 Audio: OFF";
      if (audioEnabled) initAudio();
    }

    function toggleLang() {
      currentStory = (currentStory === storyES) ? storyEN : storyES;
      document.getElementById('langBtn').innerText = (currentStory === storyES) ? "🌐 ES" : "🌐 EN";
      restart();
    }

    function restart() {
      clearTimeout(timer);
      step = 0;
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('logoOutro').style.display = 'none';
      document.getElementById('waBubble').style.display = 'none';
      document.getElementById('textBox').innerHTML = (currentStory === storyES) 
        ? "TOCA INICIAR PARA VER EL ANUNCIO" 
        : "TAP PLAY TO WATCH THE AD";
      document.getElementById('textBox').classList.add('active');
      if (isPlaying) {
        nextFrame();
      }
    }

    // Auto-start on click
    window.addEventListener('click', () => {
      if (!isPlaying && step === 0) {
        togglePlay();
      }
    }, { once: true });
  </script>
</body>
</html>
