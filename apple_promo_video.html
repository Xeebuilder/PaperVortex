<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Vortex Studios | Apple Style Kinetic Ad</title>
  <link rel="icon" type="image/png" href="logo-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      perspective: 1200px;
    }

    /* Ambient Stage */
    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
      background: radial-gradient(circle at center, #0f0f15 0%, #000000 85%);
      overflow: hidden;
      transition: background 0.3s ease;
    }

    /* Flash Transition Overlay */
    .flash-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity 0.16s ease-out;
    }

    .flash-overlay.active {
      opacity: 0.95;
      transition: none;
    }

    /* Kinetic Text Box */
    .text-box {
      font-size: clamp(38px, 6.8vw, 92px);
      font-weight: 900;
      letter-spacing: -0.01em;
      word-spacing: 0.3em;
      line-height: 1.08;
      text-transform: uppercase;
      opacity: 0;
      transform: scale(0.94);
      transition: opacity 0.08s ease-out, transform 0.1s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 1150px;
      z-index: 10;
      will-change: transform, opacity;
    }

    .text-box.active {
      opacity: 1;
      transform: scale(1);
    }

    .text-box.beat-impact {
      animation: beatImpact 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes beatImpact {
      0% {
        transform: scale(0.92);
      }
      50% {
        transform: scale(1.025);
      }
      100% {
        transform: scale(1);
      }
    }

    /* Keyframes para que "CAMBIA ESO" crezca de forma limpia y expansiva hasta cubrir toda la pantalla */
    .text-box.cover-screen {
      animation: keyframeCoverScreen 1.25s cubic-bezier(0.15, 0.85, 0.2, 1) forwards !important;
      transform-origin: center center;
    }

    @keyframes keyframeCoverScreen {
      0% {
        opacity: 1;
        transform: scale(0.95);
        letter-spacing: -0.04em;
        color: #ff3b30;
      }
      30% {
        opacity: 1;
        transform: scale(1.6);
        letter-spacing: -0.01em;
        color: #ff3b30;
      }
      60% {
        opacity: 1;
        transform: scale(5.5);
        letter-spacing: 0.05em;
        color: #ffffff;
      }
      85% {
        opacity: 1;
        transform: scale(16);
        letter-spacing: 0.12em;
        color: #ffffff;
      }
      100% {
        opacity: 1;
        transform: scale(38);
        letter-spacing: 0.25em;
        color: #ffffff;
      }
    }

    /* WhatsApp Buyer Bubble Mockup */
    .wa-bubble-wrap {
      display: none;
      margin-top: 25px;
      background: #005c4b;
      color: #e9edef;
      padding: 18px 28px;
      border-radius: 20px;
      border-bottom-left-radius: 4px;
      font-size: clamp(20px, 3vw, 36px);
      font-weight: 600;
      max-width: 780px;
      box-shadow: 0 20px 50px rgba(0, 92, 75, 0.4);
      animation: popBubble 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    @keyframes popBubble {
      0% { transform: scale(0.6) translateY(30px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Highlights & Color Gradients */
    .highlight-red { color: #ff3b30; text-shadow: 0 0 45px rgba(255, 59, 48, 0.5); }
    .highlight-gold { color: #f5a623; text-shadow: 0 0 45px rgba(245, 166, 35, 0.5); }
    .highlight-blue { color: #2997ff; text-shadow: 0 0 45px rgba(41, 151, 255, 0.5); }
    .highlight-green { color: #30d158; text-shadow: 0 0 45px rgba(48, 209, 88, 0.5); }
    .highlight-comedy {
      color: #ffd60a;
      font-style: italic;
      font-size: 0.85em;
      text-transform: none;
      letter-spacing: -0.02em;
    }

    /* Logo Outro */
    .logo-outro {
      display: none;
      margin-bottom: 25px;
      animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.7) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .logo-img {
      height: clamp(90px, 16vw, 170px);
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.45));
    }

    /* Top Progress Bar */
    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #2997ff, #30d158);
      width: 0%;
      transition: width 0.1s linear;
      z-index: 100;
      box-shadow: 0 0 15px #2997ff;
    }

    /* Floating Apple Controls */
    .controls {
      position: absolute;
      bottom: 30px;
      display: flex;
      gap: 12px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      padding: 10px 20px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .btn {
      background: #fff;
      color: #000;
      border: none;
      font-weight: 700;
      font-size: 14px;
      padding: 10px 22px;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .btn:hover { transform: scale(1.05); background: #f0f0f0; }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .btn-ghost:hover { background: rgba(255, 255, 255, 0.25); }

    .brand-tag {
      position: absolute;
      top: 30px;
      left: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .brand-tag img {
      height: 24px;
      width: auto;
    }
  </style>
</head>
<body>

  <div class="progress-bar" id="progressBar"></div>
  <div class="flash-overlay" id="flashOverlay"></div>

  <div class="brand-tag">
    <img src="logo-icon.png" alt="Paper Vortex">
    <span>Paper Vortex Studios</span>
  </div>

  <div class="stage" id="stage">
    <div class="logo-outro" id="logoOutro">
      <img src="logo.png" alt="Paper Vortex Studios" class="logo-img">
    </div>

    <div class="text-box" id="textBox">TOCA INICIAR PARA VER EL ANUNCIO</div>

    <div class="wa-bubble-wrap" id="waBubble">
      "Hola, ¿cuánto pide de renta y cuántos cuartos tiene?"
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn" id="playBtn" onclick="togglePlay()">▶ Iniciar Anuncio</button>
      <button class="btn btn-ghost" id="audioBtn" onclick="toggleAudio()">🔊 Audio: ON</button>
      <button class="btn btn-ghost" id="langBtn" onclick="toggleLang()">🌐 ES / EN</button>
      <button class="btn btn-ghost" onclick="restart()">↺ Reiniciar</button>
    </div>
  </div>

  <script>
    // ==========================================
    // CINEMATIC STORYBOARD & PACING
    // (Act 1: El Problema a paso legible -> "CAMBIA ESO" -> Act 2: Ritmo/Percusión continua a paso legible)
    // ==========================================
    const storyES = [
      // Act 1: El Problema
      { text: "11:42 PM.", dur: 1100, type: "intro" },
      { text: "UN COMPRADOR CALIFICADO...", dur: 1200, type: "beat_slow" },
      { text: "VE TU PROPIEDAD EN BRICKELL.", dur: 1200, type: "beat_slow" },
      { text: "TE ESCRIBE POR WHATSAPP:", dur: 1100, type: "bubble", bubbleText: "«¿Cuánto pide de renta? ¿Cuántos cuartos?»" },
      { text: "Y TÚ...", dur: 1050, type: "beat_slow" },
      { text: "ESTÁS <span class='highlight-blue'>DURMIENDO.</span>", dur: 1200, type: "beat_slow" },
      { text: "O EN UNA CITA.", dur: 1100, type: "comedic_prep" },

      // Gag Cómico & Freno en Seco
      { text: "<span class='highlight-comedy'>👀 (Bueno... esperemos que sea buena cita 🥂)</span>", dur: 1950, type: "comedy_pause" },
      { text: "PERO EL COMPRADOR...", dur: 1100, type: "tension_slow" },
      { text: "<span class='highlight-red'>NO ESPERA.</span>", dur: 1100, type: "tension_slow" },
      { text: "LE ESCRIBIÓ AL OTRO REALTOR.", dur: 1150, type: "tension_slow" },
      { text: "Y PERDISTE <span class='highlight-red'>$15,000</span> EN COMISIÓN.", dur: 1300, type: "tension_slow" },

      // Act 2: "CAMBIA ESO" - Crece de forma limpia cubriendo la pantalla con sonido WUUUUH
      { text: "<span class='highlight-red'>CAMBIA ESO.</span>", dur: 1250, type: "cover_screen" },

      // Act 3: RITMO CONTINUO DE PERCUSIÓN SINCRONIZADO AL BEAT (Exactamente 1.200ms por slide)
      { text: "ASISTENTE DE IA EN WHATSAPP.", dur: 1200, type: "solution" },
      { text: "CONECTADO A TU WEB <span class='highlight-gold'>EN 24 HORAS</span>.", dur: 1200, type: "solution" },
      { text: "SABE SI ES <span class='highlight-gold'>VENTA O ALQUILER</span>.", dur: 1200, type: "solution" },
      { text: "CUARTOS. METRAJE. PRECIOS. HOA.", dur: 1200, type: "solution" },
      { text: "CALIFICA EL PRESUPUESTO REAL.", dur: 1200, type: "solution" },
      { text: "TE ENTREGA LA CITA <span class='highlight-green'>AGENDADA</span>.", dur: 1200, type: "solution" },
      { text: "MIENTRAS DUERMES...", dur: 1200, type: "solution" },
      { text: "<span class='highlight-comedy'>😉 (O sigues en tu cita)</span>", dur: 1200, type: "comedy_wink" },

      // Outro
      { text: "PRUÉBALO <span class='highlight-green'>1 SEMANA 100% GRATIS.</span>", dur: 1200, type: "solution" },
      { text: "PAPER VORTEX STUDIOS.", dur: 2600, type: "outro_logo" }
    ];

    const storyEN = [
      { text: "11:42 PM.", dur: 1100, type: "intro" },
      { text: "A QUALIFIED LUXURY BUYER...", dur: 1200, type: "beat_slow" },
      { text: "SEES YOUR BRICKELL LISTING.", dur: 1200, type: "beat_slow" },
      { text: "MESSAGES YOUR WHATSAPP:", dur: 1100, type: "bubble", bubbleText: "“How much is rent? How many bedrooms?”" },
      { text: "AND YOU...", dur: 1050, type: "beat_slow" },
      { text: "ARE SOUND <span class='highlight-blue'>ASLEEP.</span>", dur: 1200, type: "beat_slow" },
      { text: "OR ON A DATE.", dur: 1100, type: "comedic_prep" },

      // Comic Relief
      { text: "<span class='highlight-comedy'>👀 (Hey... hope it's a good date 🥂)</span>", dur: 1950, type: "comedy_pause" },
      { text: "BUT THE BUYER...", dur: 1100, type: "tension_slow" },
      { text: "<span class='highlight-red'>DOESN'T WAIT.</span>", dur: 1100, type: "tension_slow" },
      { text: "THEY MESSAGED ANOTHER AGENT.", dur: 1150, type: "tension_slow" },
      { text: "AND YOU LOST A <span class='highlight-red'>$15,000</span> COMMISSION.", dur: 1300, type: "tension_slow" },

      // "CHANGE THAT"
      { text: "<span class='highlight-red'>CHANGE THAT.</span>", dur: 1250, type: "cover_screen" },

      // Continuous Rhythmic Groove Locked To Beat
      { text: "24/7 AI AGENT ON WHATSAPP.", dur: 1200, type: "solution" },
      { text: "CONNECTED TO YOUR WEBSITE <span class='highlight-gold'>IN 24H</span>.", dur: 1200, type: "solution" },
      { text: "KNOWS <span class='highlight-gold'>SALE OR RENT</span>.", dur: 1200, type: "solution" },
      { text: "BEDROOMS. SQUARE FOOTAGE. HOA.", dur: 1200, type: "solution" },
      { text: "QUALIFIES REAL BUYER FUNDS.", dur: 1200, type: "solution" },
      { text: "HANDS YOU THE <span class='highlight-green'>BOOKED TOUR</span>.", dur: 1200, type: "solution" },
      { text: "WHILE YOU SLEEP...", dur: 1200, type: "solution" },
      { text: "<span class='highlight-comedy'>😉 (Or stay on your date)</span>", dur: 1200, type: "comedy_wink" },

      // Outro
      { text: "TEST IT <span class='highlight-green'>1 WEEK 100% FREE.</span>", dur: 1200, type: "solution" },
      { text: "PAPER VORTEX STUDIOS.", dur: 2600, type: "outro_logo" }
    ];

    let currentStory = storyES;
    let step = 0;
    let isPlaying = false;
    let audioEnabled = true;
    let timer = null;
    let audioCtx = null;
    let masterGain = null;
    let noiseBuffer = null;
    let rhythmInterval = null;
    let rhythmStep = 0;

    // ==========================================
    // AUDIO ENGINE: 808, SYNTH, PIANO, WUUUUH & RITMO CONTINUO
    // ==========================================
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        const comp = audioCtx.createDynamicsCompressor();
        comp.threshold.setValueAtTime(-14, audioCtx.currentTime);
        comp.knee.setValueAtTime(20, audioCtx.currentTime);
        comp.ratio.setValueAtTime(12, audioCtx.currentTime);
        comp.attack.setValueAtTime(0.002, audioCtx.currentTime);
        comp.release.setValueAtTime(0.2, audioCtx.currentTime);

        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.75, audioCtx.currentTime);

        masterGain.connect(comp);
        comp.connect(audioCtx.destination);

        const len = audioCtx.sampleRate * 2;
        noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Heavy 808 Sub Kick
    function play808(intensity = 1.0) {
      if (!audioEnabled || !audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(165, t);
      osc.frequency.exponentialRampToValueAtTime(44, t + 0.12);
      osc.frequency.exponentialRampToValueAtTime(32, t + 0.42);

      gain.gain.setValueAtTime(0.95 * intensity, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.46);

      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.48);
    }

    // Crisp Tech Clap
    function playClap() {
      if (!audioEnabled || !audioCtx || !noiseBuffer) return;
      const t = audioCtx.currentTime;
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1700, t);
      filter.Q.setValueAtTime(2, t);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.55, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      noise.start(t);
      noise.stop(t + 0.19);
    }

    // Single Hi-Hat
    function playSingleHat(t, accented = false) {
      if (!audioEnabled || !audioCtx || !noiseBuffer) return;
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(7500, t);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(accented ? 0.32 : 0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      noise.start(t);
      noise.stop(t + 0.06);
    }

    // Open Hi-Hat (Para contratiempos del ritmo)
    function playOpenHat(t) {
      if (!audioEnabled || !audioCtx || !noiseBuffer) return;
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(6500, t);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.22, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      noise.start(t);
      noise.stop(t + 0.18);
    }

    // Bass Synth Note
    function playBassTone(t, freq) {
      if (!audioEnabled || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, t);

      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(420, t);
      filter.frequency.exponentialRampToValueAtTime(110, t + 0.16);
      filter.Q.setValueAtTime(4, t);

      gain.gain.setValueAtTime(0.38, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.19);
    }

    // Synth / Electric Piano Chords
    function playSynthChord(chordFreqs, duration = 0.5) {
      if (!audioEnabled || !audioCtx) return;
      const t = audioCtx.currentTime;
      chordFreqs.forEach(freq => {
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, t);

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1900, t);
        filter.frequency.exponentialRampToValueAtTime(320, t + duration);
        filter.Q.setValueAtTime(2.5, t);

        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);

        osc.start(t);
        osc.stop(t + duration + 0.05);
      });
    }

    // Comic Vinyl Scratch
    function playRecordScratch() {
      if (!audioEnabled || !audioCtx || !noiseBuffer) return;
      const t = audioCtx.currentTime;

      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(3200, t);
      filter.frequency.exponentialRampToValueAtTime(180, t + 0.28);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.65, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      noise.start(t);
      noise.stop(t + 0.31);

      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, t);
      osc.frequency.exponentialRampToValueAtTime(50, t + 0.28);
      oscGain.gain.setValueAtTime(0.45, t);
      oscGain.gain.exponentialRampToValueAtTime(0.001, t + 0.29);
      osc.connect(oscGain);
      oscGain.connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.3);
    }

    // Comedic Elevator Chime (Ding!)
    function playComedyChime() {
      if (!audioEnabled || !audioCtx) return;
      const t = audioCtx.currentTime;
      const notes = [1046.5, 1318.5, 1567.98]; // C6, E6, G6
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t + idx * 0.08);

        gain.gain.setValueAtTime(0.28, t + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.08 + 0.65);

        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(t + idx * 0.08);
        osc.stop(t + idx * 0.08 + 0.7);
      });
    }

    // EL SONIDO "WUUUUH" (Cinematic Riser Whoosh)
    function playWhooshRiser() {
      if (!audioEnabled || !audioCtx || !noiseBuffer) return;
      const t = audioCtx.currentTime;

      // Noise Whoosh Riser
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(140, t);
      filter.frequency.exponentialRampToValueAtTime(3800, t + 1.05);
      filter.frequency.exponentialRampToValueAtTime(100, t + 1.22);
      filter.Q.setValueAtTime(3.6, t);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.02, t);
      gain.gain.linearRampToValueAtTime(0.9, t + 1.05);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 1.25);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);
      noise.start(t);
      noise.stop(t + 1.26);

      // Sub-Bass Swell
      const osc = audioCtx.createOscillator();
      const oscGain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(52, t);
      osc.frequency.linearRampToValueAtTime(220, t + 1.05);
      osc.frequency.exponentialRampToValueAtTime(35, t + 1.22);

      oscGain.gain.setValueAtTime(0.02, t);
      oscGain.gain.linearRampToValueAtTime(0.95, t + 1.05);
      oscGain.gain.exponentialRampToValueAtTime(0.001, t + 1.25);

      osc.connect(oscGain);
      oscGain.connect(masterGain);
      osc.start(t);
      osc.stop(t + 1.26);
    }

    // ==========================================
    // RITMO CONTINUO DE PERCUSIÓN & GROOVE (122 BPM)
    // Toca en segundo plano de forma fluida mientras el texto se lee cómodamente
    // ==========================================
    const bassRhythm = [
      43.65, 0, 43.65, 0,      // F1
      51.91, 0, 43.65, 58.27,  // G#1, F1, Bb1
      43.65, 0, 43.65, 0,      // F1
      65.41, 0, 58.27, 51.91   // C2, Bb1, G#1
    ];

    function stopPercussionRhythm() {
      if (rhythmInterval) {
        clearInterval(rhythmInterval);
        rhythmInterval = null;
      }
    }

    // Renderizado instantáneo de slide sincronizado con el golpe (beat-impact)
    function renderFrame(frame) {
      const textBox = document.getElementById('textBox');
      const progressBar = document.getElementById('progressBar');
      textBox.classList.remove('cover-screen', 'beat-impact');
      textBox.innerHTML = frame.text;
      void textBox.offsetWidth; // Forzar reflow para que beatImpact se dispare en el milisegundo exacto
      textBox.classList.add('active', 'beat-impact');

      const pct = ((step + 1) / currentStory.length) * 100;
      progressBar.style.width = pct + '%';
    }

    // ==========================================
    // BEAT SYNCHRONIZER (100 BPM)
    // Sincroniza al 100% cada golpe de percusión con la aparición de las letras
    // 150ms por semicorchea | 1.200ms cada 8 pasos (2 tiempos musicales)
    // ==========================================
    function startBeatSynchronizer() {
      if (rhythmInterval) clearInterval(rhythmInterval);
      rhythmStep = 0;
      const stepMs = 150; // 100 BPM

      function beatTick() {
        if (!isPlaying) return;
        const t = audioCtx ? audioCtx.currentTime : 0;

        // --- CADA 8 PASOS (1.200 ms): CAMBIO DE DIAPOSITIVA AL MISMO TIEMPO QUE EL KICK ---
        if (rhythmStep % 8 === 0) {
          if (step < currentStory.length) {
            const frame = currentStory[step];
            if (frame.type === 'solution' || frame.type === 'comedy_wink') {
              renderFrame(frame);
              if (frame.type === 'comedy_wink') {
                playComedyChime();
              }
              step++;
            } else if (frame.type === 'outro_logo') {
              // Fin de la solución -> Mostrar outro
              stopPercussionRhythm();
              const textBox = document.getElementById('textBox');
              const logoOutro = document.getElementById('logoOutro');
              const progressBar = document.getElementById('progressBar');
              textBox.classList.remove('beat-impact');
              textBox.innerHTML = frame.text;
              textBox.classList.add('active');
              logoOutro.style.display = 'block';
              textBox.style.fontSize = 'clamp(24px, 4.5vw, 52px)';
              progressBar.style.width = '100%';
              play808(1.4);
              playOutroPad();
              timer = setTimeout(() => {
                if (isPlaying) {
                  step = 0;
                  nextFrame();
                }
              }, frame.dur);
              return;
            }
          }
        }

        // --- GOLPES DE PERCUSIÓN & BASSLINE ---
        if (audioEnabled && audioCtx) {
          const s = rhythmStep % 16;

          // Kick en tiempo 1 (paso 0) y tiempo 3 (paso 8) + sincopado en paso 10
          if (s === 0 || s === 8) {
            play808(1.0);
          } else if (s === 10) {
            play808(0.65);
          }

          // Snare / Clap en tiempo 2 (paso 4) y tiempo 4 (paso 12)
          if (s === 4 || s === 12) {
            playClap();
          }

          // Hi-Hat rítmico continuo en cada semicorchea con acentos
          playSingleHat(t, s % 2 === 0);

          // Open Hat en contratiempos (pasos 6 y 14)
          if (s === 6 || s === 14) {
            playOpenHat(t);
          }

          // Bajo melódico continuo
          const note = bassRhythm[s];
          if (note > 0) {
            playBassTone(t, note);
          }

          // Acordes de sintetizador en compases (pasos 0 y 8)
          if (s === 0 || s === 8) {
            const chord = (s === 0) ? chordFm : chordDb;
            playSynthChord(chord, 0.42);
          }
        }

        rhythmStep++;
      }

      // Dispara el downbeat y la primera diapositiva inmediatamente
      beatTick();

      rhythmInterval = setInterval(beatTick, stepMs);
    }

    // Grand Finale Pad
    function playOutroPad() {
      if (!audioEnabled || !audioCtx) return;
      playSynthChord([174.61, 207.65, 261.63, 311.13, 392.0], 2.2);
    }

    const chordFm = [174.61, 207.65, 261.63];
    const chordDb = [138.59, 174.61, 207.65];
    const chordBbm = [116.54, 138.59, 174.61];

    function nextFrame() {
      if (step >= currentStory.length) {
        step = 0;
      }

      const frame = currentStory[step];
      const stage = document.getElementById('stage');
      const textBox = document.getElementById('textBox');
      const waBubble = document.getElementById('waBubble');
      const logoOutro = document.getElementById('logoOutro');
      const flashOverlay = document.getElementById('flashOverlay');
      const progressBar = document.getElementById('progressBar');

      // Si entramos en la sección de solución, el Beat Synchronizer toma el control
      if (frame.type === 'solution') {
        flashOverlay.classList.remove('active');
        startBeatSynchronizer();
        return;
      }

      // Reset states
      textBox.classList.remove('active', 'cover-screen', 'beat-impact');
      waBubble.style.display = 'none';
      logoOutro.style.display = 'none';

      textBox.innerHTML = frame.text;
      textBox.classList.add('active');

      const pct = ((step + 1) / currentStory.length) * 100;
      progressBar.style.width = pct + '%';

      switch (frame.type) {
        case 'intro':
          stopPercussionRhythm();
          playSynthChord(chordFm, 0.9);
          break;

        case 'beat_slow':
          play808(0.85);
          playSynthChord(chordFm, 0.45);
          break;

        case 'bubble':
          play808(0.75);
          waBubble.innerText = frame.bubbleText;
          waBubble.style.display = 'inline-block';
          break;

        case 'comedic_prep':
          playSynthChord(chordDb, 0.5);
          break;

        case 'comedy_pause':
          playRecordScratch();
          setTimeout(playComedyChime, 250);
          break;

        case 'tension_slow':
          playSynthChord(chordBbm, 0.8);
          break;

        case 'cover_screen':
          textBox.classList.add('cover-screen');
          playWhooshRiser();
          setTimeout(() => {
            flashOverlay.classList.add('active');
          }, 1050);
          break;
      }

      step++;
      if (isPlaying) {
        timer = setTimeout(nextFrame, frame.dur);
      }
    }

    function togglePlay() {
      initAudio();
      isPlaying = !isPlaying;
      const btn = document.getElementById('playBtn');

      if (isPlaying) {
        btn.innerText = "⏸ Pausar";
        if (step > 0 && step < currentStory.length && (currentStory[step].type === 'solution' || currentStory[step].type === 'comedy_wink')) {
          startBeatSynchronizer();
        } else {
          nextFrame();
        }
      } else {
        btn.innerText = "▶ Reanudar";
        stopPercussionRhythm();
        clearTimeout(timer);
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById('audioBtn').innerText = audioEnabled ? "🔊 Audio: ON" : "🔇 Audio: OFF";
      if (audioEnabled) {
        initAudio();
      } else {
        stopPercussionRhythm();
      }
    }

    function toggleLang() {
      currentStory = (currentStory === storyES) ? storyEN : storyES;
      document.getElementById('langBtn').innerText = (currentStory === storyES) ? "🌐 ES" : "🌐 EN";
      restart();
    }

    function restart() {
      clearTimeout(timer);
      stopPercussionRhythm();
      step = 0;
      document.getElementById('progressBar').style.width = '0%';
      document.getElementById('logoOutro').style.display = 'none';
      document.getElementById('waBubble').style.display = 'none';
      document.getElementById('textBox').classList.remove('cover-screen', 'beat-impact');
      document.getElementById('textBox').style.fontSize = '';
      document.getElementById('textBox').innerHTML = (currentStory === storyES) 
        ? "TOCA INICIAR PARA VER EL ANUNCIO" 
        : "TAP PLAY TO WATCH THE AD";
      document.getElementById('textBox').classList.add('active');
      if (isPlaying) {
        nextFrame();
      }
    }

    window.addEventListener('click', () => {
      if (!isPlaying && step === 0) {
        togglePlay();
      }
    }, { once: true });
  </script>
</body>
