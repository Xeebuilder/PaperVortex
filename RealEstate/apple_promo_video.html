<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Vortex Studios | Apple Style Promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px;
    background: radial-gradient(circle at center, #111 0%, #000 70%);
  }

  .text-box {
    font-size: clamp(38px, 7.5vw, 96px);
    font-weight: 900;
    letter-spacing: -2.5px;
    line-height: 1.05;
    text-transform: uppercase;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.12s ease-out, transform 0.14s cubic-bezier(0.16, 1, 0.3, 1);
    max-width: 1100px;
  }

  .text-box.active {
    opacity: 1;
    transform: scale(1);
  }

  .highlight-red { color: #ff3b30; }
  .highlight-gold { color: #d4af37; text-shadow: 0 0 40px rgba(212, 175, 55, 0.4); }
  .highlight-blue { color: #2997ff; }
  .highlight-green { color: #30d158; }

  /* Controls Overlay */
  .controls {
    position: absolute;
    bottom: 30px;
    display: flex;
    gap: 12px;
    z-index: 100;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    padding: 10px 18px;
    border-radius: 40px;
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .btn {
    background: #fff;
    color: #000;
    border: none;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: 30px;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  .btn:hover { transform: scale(1.04); background: #f0f0f0; }
  .btn-lang {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
  }
  .btn-lang:hover { background: rgba(255, 255, 255, 0.25); color: #fff; }

  .progress-bar {
    position: absolute;
    top: 0;
    left: 0;
    height: 4px;
    background: #fff;
    width: 0%;
    transition: width 0.1s linear;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="progress-bar" id="progress"></div>
  <div class="text-box" id="textBox">PRESIONA REPRODUCIR</div>

  <div class="controls" id="controls">
    <button class="btn" id="playBtn" onclick="togglePlay()">▶ Iniciar Video</button>
    <button class="btn btn-lang" id="langBtn" onclick="toggleLang()">🌐 Idioma: ES</button>
  </div>
</div>

<script>
let lang = "ES";
let isPlaying = false;
let timeoutId = null;

const SCRIPT_ES = [
  { text: "UN COMPRADOR.", duration: 700, hit: true },
  { text: "TU WHATSAPP.", duration: 700, hit: true },
  { text: "11:42 PM.", duration: 900, hit: true },
  { text: "PREGUNTA POR TU PROPIEDAD.", duration: 1100, hit: false },
  { text: "Y TÚ ESTÁS...", duration: 800, hit: false },
  { text: "DURMIENDO.", duration: 1200, hit: true, class: "highlight-red" },
  { text: "O EN UNA CITA.", duration: 900, hit: false },
  { text: "PARA CUANDO DESPIERTAS...", duration: 1100, hit: false },
  { text: "YA COMPRÓ CON OTRO.", duration: 1400, hit: true, class: "highlight-red" },
  { text: "CAMBIA ESO.", duration: 1000, hit: true, class: "highlight-blue" },
  { text: "TU PÁGINA WEB.", duration: 800, hit: true },
  { text: "CONECTADA A TU WHATSAPP.", duration: 1000, hit: true },
  { text: "CON INTELIGENCIA ARTIFICIAL.", duration: 1300, hit: true, class: "highlight-gold" },
  { text: "NO RESPUESTAS VACÍAS.", duration: 900, hit: false },
  { text: "DATOS REALES.", duration: 900, hit: true },
  { text: "PRECIOS.", duration: 500, hit: true, class: "highlight-green" },
  { text: "ZONAS.", duration: 500, hit: true },
  { text: "HOA.", duration: 500, hit: true },
  { text: "FINANCIAMIENTO.", duration: 700, hit: true, class: "highlight-green" },
  { text: "EN 2 SEGUNDOS.", duration: 900, hit: true },
  { text: "CALIFICA SU PRESUPUESTO.", duration: 1100, hit: false },
  { text: "Y TE LO PASA LISTO.", duration: 1000, hit: true },
  { text: "1 SEMANA 100% GRATIS.", duration: 1600, hit: true, class: "highlight-gold" },
  { text: "SIN COMPROMISOS.", duration: 900, hit: false },
  { text: "PAPER VORTEX STUDIOS.", duration: 1400, hit: true, class: "highlight-blue" },
  { text: "PRUÉBALO HOY. ESCRÍBENOS.", duration: 2400, hit: true }
];

const SCRIPT_EN = [
  { text: "A BUYER.", duration: 700, hit: true },
  { text: "YOUR WHATSAPP.", duration: 700, hit: true },
  { text: "11:42 PM.", duration: 900, hit: true },
  { text: "ASKS ABOUT YOUR LISTING.", duration: 1100, hit: false },
  { text: "AND YOU ARE...", duration: 800, hit: false },
  { text: "ASLEEP.", duration: 1200, hit: true, class: "highlight-red" },
  { text: "BY THE TIME YOU WAKE UP...", duration: 1100, hit: false },
  { text: "THEY BOUGHT WITH SOMEONE ELSE.", duration: 1400, hit: true, class: "highlight-red" },
  { text: "CHANGE THAT.", duration: 1000, hit: true, class: "highlight-blue" },
  { text: "YOUR WEBSITE.", duration: 800, hit: true },
  { text: "CONNECTED TO WHATSAPP.", duration: 1000, hit: true },
  { text: "POWERED BY AI.", duration: 1300, hit: true, class: "highlight-gold" },
  { text: "NO VAGUE REPLIES.", duration: 900, hit: false },
  { text: "REAL NUMBERS.", duration: 900, hit: true },
  { text: "PRICES.", duration: 500, hit: true, class: "highlight-green" },
  { text: "ZONES.", duration: 500, hit: true },
  { text: "HOA FEES.", duration: 500, hit: true },
  { text: "FINANCING.", duration: 700, hit: true, class: "highlight-green" },
  { text: "IN 2 SECONDS.", duration: 900, hit: true },
  { text: "QUALIFIES THEIR BUDGET.", duration: 1100, hit: false },
  { text: "DELIVERS THE LEAD TO YOU.", duration: 1000, hit: true },
  { text: "1 WEEK 100% FREE.", duration: 1600, hit: true, class: "highlight-gold" },
  { text: "ZERO COMMITMENT.", duration: 900, hit: false },
  { text: "PAPER VORTEX STUDIOS.", duration: 1400, hit: true, class: "highlight-blue" },
  { text: "TEST IT TODAY. DM US.", duration: 2400, hit: true }
];

// Web Audio synthesizer for minimal Apple-style percussion beat
let audioCtx = null;
function playBeat(isHit = false) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (isHit) {
      osc.frequency.setValueAtTime(140, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.18);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.2);
    } else {
      osc.frequency.setValueAtTime(260, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.06);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.1);
    }
  } catch(e) {}
}

const box = document.getElementById("textBox");
const progress = document.getElementById("progress");

function runSequence(slides) {
  let totalTime = slides.reduce((acc, s) => acc + s.duration, 0);
  let elapsed = 0;
  let idx = 0;

  function next() {
    if (idx >= slides.length || !isPlaying) {
      isPlaying = false;
      document.getElementById("playBtn").textContent = "▶ Repetir Video";
      progress.style.width = "0%";
      return;
    }

    const item = slides[idx];
    box.className = "text-box" + (item.class ? " " + item.class : "");
    box.textContent = item.text;

    // Trigger hit sound
    playBeat(item.hit);

    // Pop animation
    requestAnimationFrame(() => {
      box.classList.add("active");
    });

    elapsed += item.duration;
    progress.style.width = `${(elapsed / totalTime) * 100}%`;

    timeoutId = setTimeout(() => {
      box.classList.remove("active");
      idx++;
      setTimeout(next, 50); // micro-pause between beats
    }, item.duration - 60);
  }

  next();
}

function togglePlay() {
  if (isPlaying) {
    isPlaying = false;
    clearTimeout(timeoutId);
    document.getElementById("playBtn").textContent = "▶ Iniciar Video";
    box.textContent = "PAUSADO";
    box.className = "text-box active";
    return;
  }

  isPlaying = true;
  document.getElementById("playBtn").textContent = "⏸ Pausar";
  const slides = lang === "ES" ? SCRIPT_ES : SCRIPT_EN;
  runSequence(slides);
}

function toggleLang() {
  lang = lang === "ES" ? "EN" : "ES";
  document.getElementById("langBtn").textContent = `🌐 Idioma: ${lang}`;
  if (!isPlaying) {
    box.textContent = lang === "ES" ? "LISTO PARA REPRODUCIR" : "READY TO PLAY";
  }
}
</script>
</body>
</html>
