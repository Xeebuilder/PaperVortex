  .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .bar button { padding: 8px 12px; border-radius: 8px; border: 1px solid #2a2f38; background: #181b21; color: #e8e8e8; cursor: pointer; }
  .bar button.active { background: #25d366; color: #000; border-color: #25d366; }
  .progress { margin-left: auto; font-size: 14px; color: #8a8f98; }
  .card { background: #181b21; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr auto; gap: 10px; border: 1px solid transparent; }
  .card.sent { opacity: 0.45; border-color: #25d36655; }
  .name { font-weight: 600; font-size: 16px; }
  .meta { font-size: 12px; color: #8a8f98; margin: 2px 0 8px; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #2a2f38; margin-right: 6px; }
  .idea { font-size: 13px; color: #c9cdd4; line-height: 1.4; }
  .preview { font-size: 13px; color: #c9cdd4; white-space: pre-wrap; margin-top: 10px; display: none; background: #0f1115; padding: 10px; border-radius: 8px; line-height: 1.4; }
  .card.open .preview { display: block; }
  .actions { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 150px; }
  .actions a, .actions button { text-align: center; padding: 8px 10px; border-radius: 8px; font-size: 13px; text-decoration: none; cursor: pointer; border: 1px solid #2a2f38; background: #0f1115; color: #e8e8e8; }
  .actions a.wa { background: #25d366; color: #000; border-color: #25d366; font-weight: 600; }
  .actions label { font-size: 12px; color: #8a8f98; display: flex; gap: 6px; align-items: center; justify-content: center; }
</style>
</head>
<body>

<h1>📲 Outreach WhatsApp</h1>
<div class="sub">Pulsa "Abrir WhatsApp" → se abre el chat con el mensaje ya escrito → tú solo le das Enviar. Se marca como enviado automáticamente.</div>

<div class="config">
  <div><label>Tu nombre</label><input id="myName"></div>
  <div><label>Precio ($)</label><input id="price"></div>
  <div class="full">
    <label>Plantilla del mensaje (misma estructura para todos, la idea cambia por negocio)</label>
    <textarea id="tpl"></textarea>
    <div class="hint">
      <span>Variables: {nombre} {negocio} {idea} {desc} {resultado} {precio}</span>
      <button id="restoreTpl">Restaurar plantilla original</button>
    </div>
  </div>
</div>

<div class="bar">
  <button data-f="all" class="active">Todos</button>
  <button data-f="Lechería">Lechería</button>
  <button data-f="Caracas">Caracas</button>
  <button data-f="pending">Pendientes</button>
  <button id="reset">Reiniciar enviados</button>
  <div class="progress" id="progress"></div>
</div>

<div id="list"></div>

const $ = id => document.getElementById(id);
// v2 keys so old saved values from the previous version don't override the new defaults
const K = { sent: "v2_sent", myName: "v3_myName", price: "v2_price", tpl: "v2_tpl" };
const store = {
  get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
};

let sent = store.get(K.sent, {});
let filter = "all";

$("myName").value = store.get(K.myName, DEFAULTS.myName);
$("price").value = store.get(K.price, DEFAULTS.price);
$("tpl").value = store.get(K.tpl, DEFAULT_TPL);
["myName", "price", "tpl"].forEach(id =>
  $(id).addEventListener("input", () => { store.set(K[id], $(id).value); render(); }));

$("restoreTpl").addEventListener("click", () => {
  $("tpl").value = DEFAULT_TPL;
  store.set(K.tpl, DEFAULT_TPL);
  render();
});

function message(b) {
  return $("tpl").value
    .replaceAll("{nombre}", $("myName").value.trim() || DEFAULTS.myName)
    .replaceAll("{negocio}", b.n)
    .replaceAll("{idea}", b.idea)
    .replaceAll("{desc}", b.d)
    .replaceAll("{resultado}", b.r)
    .replaceAll("{precio}", $("price").value.trim() || "30")
    .trim();
}

function render() {
  const list = $("list");
  list.innerHTML = "";
  const items = BIZ.filter(b =>
    filter === "all" ? true :
    filter === "pending" ? !sent[b.p] :
    b.c === filter);

  items.forEach(b => {
    const msg = message(b);
    const url = `https://wa.me/${b.p}?text=${encodeURIComponent(msg)}`;
    const card = document.createElement("div");
    card.className = "card" + (sent[b.p] ? " sent" : "");
    card.innerHTML = `
      <div>
        <div class="name"></div>
        <div class="meta"><span class="tag">${b.c}</span><span class="tag">${b.t}</span>+${b.p}</div>
        <div class="idea"></div>
        <div class="preview"></div>
      </div>
      <div class="actions">
        <a class="wa" href="${url}" target="_blank" rel="noopener">Abrir WhatsApp</a>
        <button class="copy">Copiar mensaje</button>
        <button class="toggle">Ver mensaje</button>
        <label><input type="checkbox" ${sent[b.p] ? "checked" : ""}> Enviado</label>
      </div>`;
    card.querySelector(".name").textContent = b.n;
    card.querySelector(".idea").textContent = `💡 ${b.idea} — ${b.d}`;
    card.querySelector(".preview").textContent = msg;
    card.querySelector(".wa").addEventListener("click", () => mark(b.p, true));
    card.querySelector(".copy").addEventListener("click", e => {
      navigator.clipboard.writeText(msg);
      e.target.textContent = "¡Copiado!";
      setTimeout(() => (e.target.textContent = "Copiar mensaje"), 1200);
    });
    card.querySelector(".toggle").addEventListener("click", () => card.classList.toggle("open"));
    card.querySelector("input").addEventListener("change", e => mark(b.p, e.target.checked));
    list.appendChild(card);
  });

  const done = BIZ.filter(b => sent[b.p]).length;
  $("progress").textContent = `${done} / ${BIZ.length} enviados`;
}

function mark(phone, val) {
  if (val) sent[phone] = Date.now(); else delete sent[phone];
  store.set(K.sent, sent);
  setTimeout(render, 300);
}

document.querySelectorAll(".bar button[data-f]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".bar button[data-f]").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    filter = btn.dataset.f;
    render();
  });
});
$("reset").addEventListener("click", () => {
  if (confirm("¿Reiniciar todos los enviados?")) { sent = {}; store.set(K.sent, sent); render(); }
});

render();
</script>
</body>
</html>
